{% extends 'base.html' %}

{% block content %}

<h1>아기사자 등록</h1>

{% if error_message %}
  <p>{{ error_message }}</p>
{% endif %}

<form method="post">

  {% csrf_token %}

  <div>

    <label>이름</label><br>

    <input type="text" name="name">

  </div>

  <br>

  <div>

    <label>트랙</label><br>

    <input type="text" name="track">

  </div>

  <br>

  <button type="submit">

    등록

  </button>

</form>

<hr>

<a href="{% url 'lions:lion_list' %}">

  목록으로

</a>

{% endblock %}
