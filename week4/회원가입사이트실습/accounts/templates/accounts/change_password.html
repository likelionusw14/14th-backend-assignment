<!DOCTYPE html>
<html>
<head><title>비밀번호 변경</title></head>
<body>
  <h2>비밀번호 변경</h2>
  {% if error %}
    <p style="color: red;">{{ error }}</p>
  {% endif %}
  <form method="POST">
    {% csrf_token %}
    <input type="password" name="current_password" placeholder="현재 비밀번호" required><br><br>
    <input type="password" name="new_password" placeholder="새 비밀번호" required><br><br>
    <button type="submit">변경하기</button>
  </form>
  <hr>
  <a href="{% url 'login_success' %}"><button type="button">돌아가기</button></a>
</body>
</html>
