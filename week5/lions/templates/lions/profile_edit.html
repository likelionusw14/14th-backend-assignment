{% extends 'base.html' %}

{% block content %}

<h1>프로필 수정</h1>
<h2>{{ lion.name }}</h2>

<form method="post">
  {% csrf_token %}

  <div>
    <label>GitHub URL</label><br>
    <input type="url" name="github_url" value="{{ profile.github_url }}"
           placeholder="https://github.com/username" style="width:300px;">
  </div>

  <br>

  <div>
    <label>자기소개</label><br>
    <textarea name="bio" rows="5" cols="50"
              placeholder="자기소개를 입력하세요">{{ profile.bio }}</textarea>
  </div>

  <br>

  <button type="submit">저장</button>
</form>

<hr>

<a href="{% url 'lion_detail' lion.id %}">취소</a>

{% endblock %}
