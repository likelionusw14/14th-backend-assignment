{% extends 'base.html' %}
{% block content %}
<h1>아기사자 목록</h1>

<form method="get" style="margin-bottom: 16px;">
  <input type="text" name="keyword" placeholder="이름 검색" value="{{ keyword }}">
  <select name="track">
    <option value="">전체 트랙</option>
    <option value="BE" {% if track == "BE" %}selected{% endif %}>Back-end</option>
    <option value="FE" {% if track == "FE" %}selected{% endif %}>Front-end</option>
    <option value="DESIGN" {% if track == "DESIGN" %}selected{% endif %}>Design</option>
  </select>
  <button type="submit">검색</button>
</form>

<ul>
  {% for lion in lions %}
    <li>
      <a href="{% url 'lion_detail' lion.id %}">
        {{ lion.name }} ({{ lion.get_track_display }})
      </a>
    </li>
  {% empty %}
    <li>아직 등록된 아기사자가 없습니다.</li>
  {% endfor %}
</ul>
<hr>
<a href="{% url 'lion_create' %}">아기사자 등록</a>
{% endblock %}
