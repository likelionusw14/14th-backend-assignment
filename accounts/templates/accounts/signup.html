<!DOCTYPE html>
<html>
<head>
    <title>회원가입</title>
</head>
<body>
    <h2>회원가입</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">가입하기</button>
    </form>
    <p>
        이미 계정이 있으신가요? <br>
        <a href="{% url 'login' %}">
            <button type="button">로그인하기</button>
        </a>
    </p>
</body>
</html>
